<section class="card border rounded-3 shadow-sm overflow-hidden" aria-labelledby="patientListTitle">
    <div class="card-header bg-white d-flex align-items-center justify-content-between flex-wrap gap-2 py-3 px-4">
        <h2 class="h6 mb-0" id="patientListTitle">Patient List</h2>
        <div class="d-flex align-items-center gap-2">
            <label for="filterSelect" class="visually-hidden">Filter patients</label>
            <select class="form-select form-select-sm fw-semibold text-primary border-primary" id="filterSelect"
                style="width:auto;">
                <option value="all">All patients</option>
                <option value="vip">VIP only</option>
                <option value="nonvip">Non-VIP</option>
            </select>
            <button type="button" class="btn btn-outline-primary btn-sm d-inline-flex align-items-center gap-2"
                id="exportBtn">
                <i class="bi bi-download" aria-hidden="true"></i>
                <span>Export</span>
            </button>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table align-middle mb-0 table-hover" id="patientTable">
            <thead>
                <tr>
                    <th scope="col" style="width:34%;" aria-sort="none">
                        <button class="th-sort" type="button" data-sort="name">
                            Patient Name <i class="bi bi-arrow-down-up" aria-hidden="true"></i>
                        </button>
                    </th>
                    <th scope="col">Contact</th>
                    <th scope="col" aria-sort="none">
                        <button class="th-sort" type="button" data-sort="country">
                            Nationality <i class="bi bi-arrow-down-up" aria-hidden="true"></i>
                        </button>
                    </th>
                    <th scope="col" aria-sort="none">
                        <button class="th-sort" type="button" data-sort="datetime">
                            Datetime <i class="bi bi-arrow-down-up" aria-hidden="true"></i>
                        </button>
                    </th>
                    <th scope="col" class="text-end" style="width:64px;">
                        <span class="visually-hidden">Action</span>
                    </th>
                </tr>
            </thead>
            <tbody id="patientBody"><!-- rendered by JS --></tbody>
        </table>
    </div>

    <!-- Loading skeleton -->
    <div id="loadingState" role="status" aria-live="polite" aria-label="Loading patients"></div>

    <!-- Empty state -->
    <div class="text-center py-5 px-3" id="emptyState" hidden>
        <i class="bi bi-search text-secondary" style="font-size:2.75rem;" aria-hidden="true"></i>
        <h3 class="h6 fw-semibold mt-3 mb-1">No patients found</h3>
        <p class="text-secondary small mb-3">We couldn't find any patient matching your search.</p>
        <button type="button" class="btn btn-outline-primary btn-sm" id="clearSearchBtn">Clear search</button>
    </div>

    <div class="card-footer bg-white d-flex align-items-center justify-content-between flex-wrap gap-2 py-3 px-4">
        <p class="text-secondary small mb-0" id="resultsInfo" aria-live="polite">Showing 0 of 0 results</p>
        <nav aria-label="Patient list pagination">
            <ul class="pagination pagination-sm mb-0 gap-1" id="pagination"><!-- rendered by JS --></ul>
        </nav>
    </div>
</section>
