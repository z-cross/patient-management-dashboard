<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>患者管理 · Patient Management</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- App styles (imports tokens → base → layout → views) -->
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <!-- <a class="skip-link" href="#main-content">Skip to content</a> -->

    <div class="app-shell d-flex">

        <!-- Sidebar (replaced by partials/sidebar.html on load) -->
        <div data-partial="sidebar"></div>

        <!-- Main column -->
        <div class="app-main flex-grow-1 min-w-0 d-flex flex-column">

            <!-- Topbar (replaced by partials/topbar.html on load) -->
            <div data-partial="topbar"></div>

            <!-- Content -->
            <main class="app-content" id="main-content">
                <div data-partial="patient-table"></div>
                <div data-partial="appointments"></div>
            </main>

        </div>
    </div>

    <!-- Detail panel lives OUTSIDE .app-shell so the offcanvas scrim
       layers above the sticky sidebar/topbar correctly -->
    <div data-partial="detail-panel"></div>
    <div data-partial="add-patient-modal"></div>

    <!-- Bootstrap bundle (Popper + all components) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App entry point (ES module) -->
    <script type="module" src="js/main.js"></script>
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>
</body>

</html>
